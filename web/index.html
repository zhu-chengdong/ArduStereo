<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArduStereo</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c293b;background:#eef2f6}
*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:25px;letter-spacing:-.5px;margin:0}h1 small{font-size:13px;font-weight:400;color:#526277;margin-left:12px}.badge{font-size:12px;background:#fff3db;color:#795617;padding:8px 12px;border:1px solid #e8d5ab;border-radius:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.panel{background:white;border:1px solid #dbe2eb;border-radius:10px;padding:20px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view{min-width:0}.view h2{font-size:13px;font-weight:600;margin:0 0 10px;color:#56667a}.image{aspect-ratio:1.6;background:#16202d;display:flex;align-items:center;justify-content:center;position:relative;border-radius:5px;overflow:hidden}.image img{width:100%;height:100%;object-fit:contain}.image img[hidden]{display:none}.placeholder{color:#a7b2c0;font-size:14px}.image img:not([hidden])+.placeholder{display:none}.caption{color:#65748a;font-size:12px;margin:12px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#f4f7fa;border-radius:6px;padding:14px}.stat span{display:block;font-size:12px;color:#56667a}.stat strong{display:block;margin-top:6px;font-size:22px;font-weight:600}.stat strong small{font-size:12px;font-weight:400}.status{font-size:14px;margin:18px 0 0;min-height:24px}.status[data-level="error"]{color:#ac293c}.status[data-level="warn"]{color:#8b620d}
.controls h2{font-size:16px;margin:0 0 18px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;margin-bottom:6px}.field input{width:100%;font:inherit;padding:9px 10px;border:1px solid #c6d0de;border-radius:5px}.readback{display:block;color:#68788c;font-size:11px;margin-top:5px;min-height:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}button{border:1px solid #c6d0de;background:white;color:#26374e;padding:10px 6px;border-radius:5px;font:inherit;font-size:13px;cursor:pointer}button.primary{background:#245c91;border-color:#245c91;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #9abfdf;outline-offset:2px}.note{font-size:12px;color:#65748a;line-height:1.65;margin:18px 0 0}.result{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6;color:#344860;min-height:42px}.result.error{color:#ac293c}footer{font-size:12px;color:#65748a;margin-top:18px;overflow-wrap:anywhere}@media(max-width:900px){.layout{grid-template-columns:1fr}.controls{max-width:none}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{margin-bottom:0}.actions{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start}}@media(max-width:580px){main{padding:15px}.views,.fields{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:18px}.badge{max-width:55%}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<header><h1>ArduStereo <small>相机控制台 · 0.3.0 开发版</small></h1><div class="badge" id="mode">正在连接本地服务</div></header>
<div class="layout"><section class="panel" aria-label="双目预览与状态">
<div class="views"><div class="view"><h2>左图像</h2><div class="image"><img id="left" alt="左相机图像" hidden><span class="placeholder">等待采集</span></div></div><div class="view"><h2>右图像</h2><div class="image"><img id="right" alt="右相机图像" hidden><span class="placeholder">等待采集</span></div></div></div>
<p class="caption" id="stamp">左右预览按共同时间戳配对；预览最多5次/秒，ROS图像保持原采集频率。</p>
<div class="stats"><div class="stat"><span>目标帧率</span><strong id="target">— <small>FPS</small></strong></div><div class="stat"><span>实际采集帧率</span><strong id="capture">—</strong></div><div class="stat"><span>实际发布帧率</span><strong id="publication">—</strong></div></div>
<p class="status" id="status" role="status">未启动采集</p>
<p class="note">实际帧率来自采集节点的单调时钟统计；显示值随观察窗口变化。图像时间戳为主机接收时间。关闭浏览器后采集继续，点击“停止采集”释放相机。</p>
</section><aside class="panel controls"><h2>采集参数</h2><div class="fields">
<div class="field"><label for="frame_rate">帧率 · 驱动原始值</label><input id="frame_rate" type="number" min="1" step="1" value="20"><small class="readback" id="actual-frame_rate">尚未读回</small></div>
<div class="field"><label for="exposure">曝光 · 驱动原始值</label><input id="exposure" type="number" min="0" step="1" value="681"><small class="readback" id="actual-exposure">尚未读回</small></div>
<div class="field"><label for="analogue_gain">模拟增益 · 驱动原始值</label><input id="analogue_gain" type="number" min="0" step="1" value="100"><small class="readback" id="actual-analogue_gain">尚未读回</small></div></div>
<div class="actions"><button id="start" class="primary">启动采集</button><button id="stop" disabled>停止采集</button><button id="apply" disabled>应用参数</button><button id="refresh" disabled>读回参数</button><button id="snapshot" disabled>成对快照</button><button id="save">保存YAML</button></div>
<p class="note">修改后点击“应用参数”，以实际读回为准。保存YAML会另存当前输入，不覆盖原配置。驱动范围在开流后查询；运行时调参尚待实机验证。</p>
<div class="result" id="result" role="status" aria-live="polite"></div>
</aside></div><footer id="logs"></footer></main>
<script>
'use strict';
const token='__TOKEN__', keys=['frame_rate','exposure','analogue_gain'];
const el=id=>document.getElementById(id);let initial=true,clientBusy=false,running=false,readAttempted=false;
function hideImages(){for(const side of ['left','right']){el(side).hidden=true;el(side).removeAttribute('src');}}
function values(){const out={};for(const key of keys){const input=el(key),v=Number(input.value);if(input.value.trim()===''||!Number.isSafeInteger(v)||v<0||(key==='frame_rate'&&v<1))throw Error('请输入有效的原始整数参数');out[key]=v;}return out;}
function message(text,error=false){el('result').textContent=text;el('result').classList.toggle('error',error);}
async function command(action){
 if(clientBusy)return;clientBusy=true;
 try{const body=['start','apply','save'].includes(action)?{controls:values()}:{};
  const response=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-ArduStereo-Token':token},body:JSON.stringify(body)});
  const result=await response.json();if(!response.ok||!result.success)throw Error(result.message||'操作失败');
  message(result.path||result.config||result.message||'完成');if(action==='start')readAttempted=false;
 }catch(error){message(error.message,true);}finally{clientBusy=false;await update();}
}
for(const action of ['start','stop','apply','refresh','snapshot','save'])el(action).addEventListener('click',()=>command(action));
function rate(value,fresh){return fresh&&value!==null&&value!==undefined&&Number.isFinite(Number(value))?Number(value).toFixed(2)+' FPS':'—';}
async function update(){try{
 const response=await fetch('/api/state');if(!response.ok)throw Error('本地服务不可用');const s=await response.json();running=s.running;
 el('mode').textContent=s.mode;el('logs').textContent='本次界面日志与另存配置　'+s.log_root;
 if(initial){for(const key of keys)el(key).value=s.requested[key];initial=false;}
 const d=s.diagnostic||{},fresh=running&&s.diagnostic_fresh;
 el('target').textContent=(s.readback?s.readback.frame_rate:s.requested.frame_rate)+' FPS';
 el('capture').textContent=rate(d.capture_fps,fresh);el('publication').textContent=rate(d.publication_fps,fresh);
 el('status').textContent=!running?(s.acquisition_exited?'采集进程已退出，状态码 '+s.exit_code+'；请检查本次采集日志':'未启动采集'):fresh?(d.state+' · '+d.message):'等待诊断或诊断已过期';
 el('status').dataset.level=s.acquisition_exited||fresh&&Number(d.level)>=2?'error':running&&(!fresh||Number(d.level)>0)?'warn':'';
 for(let i=0;i<keys.length;i++){const key=keys[i],a=s.readback;el('actual-'+key).textContent=a?('读回 '+a[key]+'　范围 '+a.minimum[i]+'–'+a.maximum[i]+' / 步长 '+a.step[i]+(a.simulated?'（模拟）':'')):'尚未确认读回';if(a){el(key).min=a.minimum[i];el(key).max=a.maximum[i];el(key).step=a.step[i];}}
 const busy=s.busy||clientBusy;el('start').disabled=running||busy;el('stop').disabled=!running||busy;el('save').disabled=busy;
 const ready=running&&fresh&&['running','degraded'].includes(d.state);
 for(const id of ['apply','refresh','snapshot'])el(id).disabled=!ready||busy;
 if(!running)hideImages();
 if(ready&&!s.readback&&!readAttempted&&!busy){readAttempted=true;setTimeout(()=>command('refresh'),0);}
 }catch(error){running=false;hideImages();el('status').textContent='本地服务连接中断';el('status').dataset.level='error';for(const id of ['start','stop','apply','refresh','snapshot','save'])el(id).disabled=true;}
}
async function preview(){try{if(running){const r=await fetch('/api/preview');if(!r.ok)throw Error('Preview unavailable');const p=await r.json();if(p.fresh){for(const side of ['left','right']){el(side).src=p[side];el(side).hidden=false;}el('stamp').textContent='共同时间戳 '+p.stamp_ns+' ns · 预览最多5次/秒';}else hideImages();}}catch{hideImages();}finally{setTimeout(preview,250);}}
async function poll(){await update();setTimeout(poll,500);}poll();preview();
</script></body></html>
